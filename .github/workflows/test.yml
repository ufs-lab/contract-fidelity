name: test
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The analysis is compiler-API code; a TypeScript bump can change what
        # the checker reports, so the supported range is tested, not assumed.
        # NOT "latest": TypeScript 7 is the Go port, whose export map points
        # "." at lib/version.cjs and moves the compiler API behind ./unstable/*.
        # This analysis uses ts.createProgram and the checker, so the supported
        # range is 5.x-6.x. CI names the versions rather than tracking latest,
        # so a new major is a deliberate decision instead of a surprise red build.
        typescript: ["5.5", "5.9", "6.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save typescript@${{ matrix.typescript }}
      - run: npm test

  go:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: go }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go/go.mod }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
